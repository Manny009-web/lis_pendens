name: Daily Lis Pendens Lead Pipeline
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright anthropic pandas openpyxl && playwright install chromium --with-deps
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_SMTP_PASSWORD: ${{ secrets.SENDER_SMTP_PASSWORD }}
          COUNTY_SUBSCRIBERS: ${{ secrets.COUNTY_SUBSCRIBERS }}
        run: python pipeline.py
